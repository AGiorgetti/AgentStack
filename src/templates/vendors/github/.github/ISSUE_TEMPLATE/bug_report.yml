# AGENTSTACK PLACEHOLDER
# Purpose: Collect bug reports with actionable detail.
# What to put here: Replace TODO prompts with project-specific guidance.
name: "Bug report"
description: "Report a defect or regression"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please provide as much detail as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: TODO: Summarize the bug in one sentence.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: TODO: Provide precise steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: TODO: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: TODO: Describe what actually happened.
    validations:
      required: true
